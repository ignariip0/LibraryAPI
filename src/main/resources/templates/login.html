<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Library API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #0b1120; color: #e2e8f0; }
        .login-card { max-width: 820px; background: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden; }
        .login-side { background: #1e1b4b; }
        .login-side .logo {
            width: 56px; height: 56px; border-radius: 14px; background: #6366f1;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #fff;
        }
        .login-side p { color: #a5b4fc; }
        .texto-suave { color: #94a3b8; }
        .rodape { color: #475569; }
        .form-label { color: #cbd5e1; }
        .input-group-text { background: #0f172a; color: #64748b; border-color: #334155; }
        .form-control { background: #0f172a; color: #e2e8f0; border-color: #334155; }
        .form-control:focus { background: #0f172a; color: #e2e8f0; border-color: #6366f1; box-shadow: none; }
        .input-group:focus-within .input-group-text { border-color: #6366f1; }
        .btn-login { background: #6366f1; border-color: #6366f1; color: #fff; }
        .btn-login:hover { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card login-card shadow-lg w-100">
        <div class="row g-0">

            <div class="col-md-5 login-side d-none d-md-flex flex-column justify-content-between p-4">
                <div class="logo"><i class="bi bi-book"></i></div>
                <div>
                    <h3 class="text-white mb-2">Library API</h3>
                    <p class="mb-0">Livros, autores e acervo em um só lugar.</p>
                </div>
            </div>

            <div class="col-md-7 p-4 p-md-5">
                <h4 class="text-white mb-1">Entrar</h4>
                <p class="texto-suave small mb-4">Use suas credenciais para acessar o acervo.</p>

                <form method="post" th:action="@{/login}">
                    <label for="username" class="form-label small">Usuário</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="username" name="username" class="form-control" required autofocus>
                    </div>

                    <label for="password" class="form-label small">Senha</label>
                    <div class="input-group mb-4">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control" required>
                        <button type="button" id="toggleSenha" class="input-group-text">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn btn-login w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                    </button>
                </form>

                <p class="rodape text-center small mt-4 mb-0">libraryapi · Spring Security</p>
            </div>

        </div>
    </div>
</div>

<script>
    const senha = document.getElementById('password');
    document.getElementById('toggleSenha').addEventListener('click', function () {
        const visivel = senha.type === 'text';
        senha.type = visivel ? 'password' : 'text';
        this.querySelector('i').className = visivel ? 'bi bi-eye' : 'bi bi-eye-slash';
    });
</script>

</body>
</html>
